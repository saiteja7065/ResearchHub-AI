# Render's free tier sleeps after 15 min idle and Supabase's free tier pauses after a week of
# inactivity; these pings keep both awake so the live demo never hits a cold start.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend (and touch the database)
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://researchhub-ai-ke4d.onrender.com' }}
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 "$BACKEND_URL/health/deep"; then exit 0; fi
            echo "Attempt $i failed, retrying..."; sleep 20
          done
          exit 1
