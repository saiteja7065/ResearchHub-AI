# Render Blueprint: Dashboard -> New -> Blueprint -> select this repo.
services:
  - type: web
    name: researchhub-ai
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python download_model.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://research-hub-ai-rho.vercel.app,http://localhost:5173
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_FAST_MODEL
        value: openai/gpt-oss-20b
